<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IITM Energy Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    /* ----------- GENERAL STYLES ----------- */
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background-image: url("photo_NAC.png"); /* Use your IITM campus image */
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      text-align: center;
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow-y: auto;
      color: #222;
      position: relative;
    }

    /* Faded overlay (increased background intensity by 10%) */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.65); /* previously 0.75 */
      z-index: -1;
    }

    h1 {
      color: #7b1113; /* IITM maroon */
      font-weight: 700;
      font-size: 28px;
      margin-bottom: 20px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }

    /* ----------- CARD DESIGN ----------- */
    .container {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      display: none;
      min-width: 360px;
      max-width: 420px;
      margin: 100px auto;
      backdrop-filter: blur(6px);
      transition: 0.4s ease-in-out;
      animation: fadeIn 1s ease;
    }

    select, button {
      padding: 10px 15px;
      margin: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    select:focus, button:focus {
      outline: none;
      border-color: #7b1113;
      box-shadow: 0 0 5px rgba(123,17,19,0.5);
    }

    button {
      background-color: #7b1113;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background-color: #a41b1e;
    }

    .result {
      margin-top: 25px;
      font-size: 17px;
      color: #333;
      font-weight: bold;
    }

    footer {
      position: fixed;
      bottom: 10px;
      width: 100%;
      font-size: 14px;
      color: #555;
    }

    /* ----------- DETAIL PAGE ----------- */
    .detail-page {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      display: none;
      min-width: 360px;
      max-width: 420px;
      margin: 100px auto;
      backdrop-filter: blur(6px);
      animation: fadeIn 0.6s ease;
    }

    .detail-item {
      margin: 20px 0;
      text-align: left;
      font-size: 17px;
    }

    .detail-item span {
      color: #7b1113;
      font-weight: bold;
    }

    .back-btn {
      margin-top: 25px;
      background-color: #7b1113;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
    }

    .back-btn:hover {
      background-color: #a41b1e;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .show {
      display: block;
    }
  </style>
</head>

<body>
  <!-- SELECTION PAGE -->
  <div id="homePage" class="container">
    <h1>Building Energy Consumption Dashboard</h1>

    <label for="typeSelect"><b>Select Type:</b></label><br>
    <select id="typeSelect" onchange="updateBuildingOptions()">
      <option value="">-- Choose Type --</option>
      <option value="academic">Academic Building</option>
      <option value="hostel">Hostel</option>
    </select><br>

    <label for="buildingSelect"><b>Select Building:</b></label><br>
    <select id="buildingSelect">
      <option value="">-- Choose a Building --</option>
    </select><br>

    <button onclick="loadEnergy()">Show Total</button>
    <div class="result" id="result"></div>
  </div>

  <!-- RESULT PAGE -->
  <div id="detailPage" class="detail-page">
    <h1 id="buildingTitle"></h1>
    <div class="detail-item">
      <span>Type:</span> <span id="buildingType"></span>
    </div>
    <div class="detail-item">
      <span>Energy Consumption:</span> <span id="energyValue"></span> kWh
    </div>
    <div class="detail-item">
      <span>Carbon Emission:</span> <span id="carbonValue"></span> tCO₂e
    </div>
    <button class="back-btn" onclick="goBack()">← Back</button>
  </div>

  <footer>© 2025 Indian Institute of Technology Madras</footer>

  <script>
    const academicBuildings = [
      "SAIF", "MSRC", "Chemistry Block", "CRYO", "BSB", "Structural",
      "Biotech-1", "Biotech-2", "ED Block", "MDS", "CFD", "NAC-I", "NAC-II",
      "Ranganathan Building", "Central Library", "DOMS"
    ];

    const hostelBuildings = [
      "Sharavathi", "Godavari", "Alakananda", "Ganga", "Jamuna", "Narmada",
      "Saraswathi", "Tapti", "Sindhu", "Brahmaputra", "Tunga", "Krishna",
      "Cauvery", "Mahanadhi", "Mandakini", "Pampa", "Tamiraparani"
    ];

    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('homePage').classList.add('show');
      }, 600);
    });

    function updateBuildingOptions() {
      const type = document.getElementById("typeSelect").value;
      const select = document.getElementById("buildingSelect");
      select.innerHTML = '<option value="">-- Choose a Building --</option>';
      const list = type === "hostel" ? hostelBuildings : (type === "academic" ? academicBuildings : []);
      list.forEach(name => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        select.appendChild(opt);
      });
    }

    async function loadEnergy() {
      const type = document.getElementById('typeSelect').value;
      const building = document.getElementById('buildingSelect').value;
      const resultDiv = document.getElementById('result');

      if (!type || !building) {
        resultDiv.innerHTML = "⚠️ Please select both type and building.";
        return;
      }

      try {
        const response = await fetch('energy.xlsx');
        if (!response.ok) throw new Error('Excel file not found.');

        const data = await response.arrayBuffer();
        const workbook = XLSX.read(data, { type: 'array' });
        const sheetName = type === "academic" ? "Sheet1" : "Sheet2";
        const sheet = workbook.Sheets[sheetName];
        if (!sheet) throw new Error(`${sheetName} not found in Excel file.`);

        const jsonData = XLSX.utils.sheet_to_json(sheet, { header: 1 });
        let found = false, totalValue = "N/A";

        for (let i = 0; i < jsonData.length; i++) {
          const row = jsonData[i];
          if (!row || row.length < 15) continue;
          const buildingName = row[1];
          const total = row[14];

          if (buildingName && buildingName.toString().trim().toLowerCase() === building.trim().toLowerCase()) {
            totalValue = total || "N/A";
            found = true;
            break;
          }
        }

        if (!found) {
          resultDiv.innerHTML = `⚠️ Building <b>${building}</b> not found in ${sheetName}.`;
          return;
        }

        document.getElementById("homePage").style.display = "none";
        const detailPage = document.getElementById("detailPage");
        detailPage.style.display = "block";

        document.getElementById("buildingTitle").textContent = building;
        document.getElementById("buildingType").textContent = type.toUpperCase();
        document.getElementById("energyValue").textContent = totalValue.toLocaleString();
        document.getElementById("carbonValue").textContent = "0";

      } catch (err) {
        console.error(err);
        resultDiv.innerHTML = `❌ Error loading data: ${err.message}`;
      }
    }

    function goBack() {
      document.getElementById("detailPage").style.display = "none";
      document.getElementById("homePage").style.display = "block";
      document.getElementById("result").innerHTML = "";
    }
  </script>
</body>
</html>
