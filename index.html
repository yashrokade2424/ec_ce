<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IITM Campus Energy Portal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
    }

    /* Background without gradient */
    .background {
      background-image: url("campus.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: brightness(1.15); /* brighten the image slightly */
      height: 100%;
      width: 100%;
      position: fixed;
      top: 0;
      left: 0;
      z-index: -1;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .logo {
      width: 120px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 20px;
      color: #ffffff;
      text-shadow: 1px 1px 8px rgba(0, 0, 0, 0.6);
    }

    select {
      padding: 12px 20px;
      font-size: 1rem;
      border-radius: 8px;
      border: none;
      margin-bottom: 20px;
      background-color: #ffffff;
      color: #333;
      width: 280px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s ease;
    }

    select:hover {
      transform: scale(1.03);
    }

    button {
      padding: 12px 30px;
      background-color: #0078d7;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    button:hover {
      background-color: #005fa3;
      transform: scale(1.05);
    }

    .info {
      margin-top: 30px;
      display: none;
      background-color: rgba(255, 255, 255, 0.15);
      padding: 20px;
      border-radius: 12px;
      color: #fff;
      width: 320px;
      text-align: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 10px rgba(0, 0, 0, 0.3);
    }

    .info h2 {
      margin-bottom: 10px;
      font-size: 1.4rem;
    }

    .info p {
      margin: 6px 0;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <div class="background"></div>

  <div class="container">
    <img src="logo.png" alt="IITM Logo" class="logo">
    <h1>Select Building to View Energy Data</h1>

    <select id="buildingSelect">
      <option value="" disabled selected>Select a building</option>
      <option value="Admin Block">Admin Block</option>
      <option value="Central Library">Central Library</option>
      <option value="Central Lecture Theatre Complex">Central Lecture Theatre Complex</option>
      <option value="Mechanical Engineering Department">Mechanical Engineering Department</option>
      <option value="Electrical Sciences Block">Electrical Sciences Block</option>
      <option value="Aerospace Engineering Department">Aerospace Engineering Department</option>
      <option value="Computer Science Department">Computer Science Department</option>
      <option value="Hostel - Mandakini">Hostel - Mandakini</option>
      <option value="Hostel - Saraswathi">Hostel - Saraswathi</option>
      <option value="Hostel - Tapti">Hostel - Tapti</option>
      <option value="Hostel - Narmada">Hostel - Narmada</option>
      <option value="Hostel - Godavari">Hostel - Godavari</option>
      <option value="Hostel - Cauvery">Hostel - Cauvery</option>
      <option value="Hostel - Ganga">Hostel - Ganga</option>
      <option value="Hostel - Krishna">Hostel - Krishna</option>
    </select>

    <button onclick="showInfo()">Next</button>

    <div id="infoSection" class="info">
      <h2 id="buildingName"></h2>
      <p><strong>Energy Consumption:</strong> <span id="energyValue">Loading...</span> kWh</p>
      <p><strong>Carbon Emission:</strong> <span id="carbonValue">0</span> kg CO₂</p>
    </div>
  </div>

  <script>
    function showInfo() {
      const select = document.getElementById('buildingSelect');
      const buildingName = select.value;
      if (!buildingName) {
        alert("Please select a building first!");
        return;
      }

      const infoSection = document.getElementById('infoSection');
      const buildingNameElem = document.getElementById('buildingName');
      const energyValueElem = document.getElementById('energyValue');
      const carbonValueElem = document.getElementById('carbonValue');

      // Simulated energy consumption data
      const energyData = {
        "Admin Block": 2300,
        "Central Library": 5400,
        "Central Lecture Theatre Complex": 3100,
        "Mechanical Engineering Department": 4600,
        "Electrical Sciences Block": 3900,
        "Aerospace Engineering Department": 2800,
        "Computer Science Department": 3700,
        "Hostel - Mandakini": 2200,
        "Hostel - Saraswathi": 1800,
        "Hostel - Tapti": 1900,
        "Hostel - Narmada": 2000,
        "Hostel - Godavari": 2400,
        "Hostel - Cauvery": 2100,
        "Hostel - Ganga": 2300,
        "Hostel - Krishna": 2500
      };

      const energy = energyData[buildingName] || "N/A";

      buildingNameElem.textContent = buildingName;
      energyValueElem.textContent = energy;
      carbonValueElem.textContent = "0";

      infoSection.style.display = "block";
    }
  </script>
</body>
</html>
