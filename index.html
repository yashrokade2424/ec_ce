<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Building Energy Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #0066cc;
    }
    .container {
      margin-top: 40px;
      background: #fff;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      display: inline-block;
      min-width: 340px;
    }
    select, button {
      padding: 10px 15px;
      margin: 10px;
      font-size: 16px;
    }
    .result {
      margin-top: 25px;
      font-size: 18px;
      font-weight: bold;
    }
    footer {
      margin-top: 40px;
      font-size: 14px;
      color: gray;
    }
    .hidden { display: none; }

    /* Detail Page Styling */
    .detail-page {
      background: #fff;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      display: inline-block;
      min-width: 340px;
    }
    .detail-item {
      margin: 20px 0;
      text-align: left;
    }
    .detail-item span {
      color: #0066cc;
      font-weight: bold;
    }
    .back-btn {
      margin-top: 25px;
      background-color: #0066cc;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
    .back-btn:hover {
      background-color: #004d99;
    }
  </style>
</head>
<body>
  <!-- PAGE 1 -->
  <div id="homePage" class="container">
    <h1>Building Energy Consumption Dashboard</h1>
    <label for="typeSelect"><b>Select Type:</b></label>
    <select id="typeSelect" onchange="updateBuildingOptions()">
      <option value="">-- Choose Type --</option>
      <option value="academic">Academic Building</option>
      <option value="hostel">Hostel</option>
    </select>
    <br>

    <label for="buildingSelect"><b>Select Building:</b></label>
    <select id="buildingSelect">
      <option value="">-- Choose a Building --</option>
    </select>
    <br>

    <button onclick="loadEnergy()">Show Total</button>
    <div class="result" id="result"></div>
  </div>

  <!-- PAGE 2 -->
  <div id="detailPage" class="detail-page hidden">
    <h1 id="buildingTitle"></h1>
    <div class="detail-item">
      <span>Type:</span> <span id="buildingType"></span>
    </div>
    <div class="detail-item">
      <span>Energy Consumption:</span> <span id="energyValue"></span> kWh
    </div>
    <div class="detail-item">
      <span>Carbon Emission:</span> <span id="carbonValue"></span> tCO₂e
    </div>
    <button class="back-btn" onclick="goBack()">← Back</button>
  </div>

  <footer>© 2025 Energy Consumption Dashboard</footer>

  <script>
    const academicBuildings = [
      "SAIF", "MSRC", "Chemistry Block", "CRYO", "BSB", "Structural",
      "Biotech-1", "Biotech-2", "ED Block", "MDS", "CFD", "NAC-I", "NAC-II",
      "Ranganathan Building", "Central Library", "DOMS"
    ];

    const hostelBuildings = [
      "Sharavathi", "Godavari", "Alakananda", "Ganga", "Jamuna", "Narmada",
      "Saraswathi", "Tapti", "Sindhu", "Brahmaputra", "Tunga", "Krishna",
      "Cauvery", "Mahanadhi", "Mandakini", "Pampa", "Tamiraparani"
    ];

    function updateBuildingOptions() {
      const type = document.getElementById("typeSelect").value;
      const select = document.getElementById("buildingSelect");
      select.innerHTML = '<option value="">-- Choose a Building --</option>';

      const list = type === "hostel" ? hostelBuildings : (type === "academic" ? academicBuildings : []);
      list.forEach(name => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        select.appendChild(opt);
      });
    }

    async function loadEnergy() {
      const type = document.getElementById('typeSelect').value;
      const building = document.getElementById('buildingSelect').value;
      const resultDiv = document.getElementById('result');

      if (!type || !building) {
        resultDiv.innerHTML = "⚠️ Please select both type and building.";
        return;
      }

      try {
        const response = await fetch('energy.xlsx');
        if (!response.ok) throw new Error('Excel file not found.');

        const data = await response.arrayBuffer();
        const workbook = XLSX.read(data, { type: 'array' });
        const sheetName = type === "academic" ? "Sheet1" : "Sheet2";
        const sheet = workbook.Sheets[sheetName];
        if (!sheet) throw new Error(`${sheetName} not found in Excel file.`);

        const jsonData = XLSX.utils.sheet_to_json(sheet, { header: 1 });
        let found = false, totalValue = "N/A";

        for (let i = 0; i < jsonData.length; i++) {
          const row = jsonData[i];
          if (!row || row.length < 15) continue;
          const buildingName = row[1];
          const total = row[14];

          if (buildingName && buildingName.toString().trim().toLowerCase() === building.trim().toLowerCase()) {
            totalValue = total || "N/A";
            found = true;
            break;
          }
        }

        if (!found) {
          resultDiv.innerHTML = `⚠️ Building <b>${building}</b> not found in ${sheetName}.`;
          return;
        }

        // Switch to next page
        document.getElementById("homePage").classList.add("hidden");
        document.getElementById("detailPage").classList.remove("hidden");

        // Update detail page content
        document.getElementById("buildingTitle").textContent = building;
        document.getElementById("buildingType").textContent = type.toUpperCase();
        document.getElementById("energyValue").textContent = totalValue.toLocaleString();
        document.getElementById("carbonValue").textContent = "0";

      } catch (err) {
        console.error(err);
        resultDiv.innerHTML = `❌ Error loading data: ${err.message}`;
      }
    }

    function goBack() {
      document.getElementById("detailPage").classList.add("hidden");
      document.getElementById("homePage").classList.remove("hidden");
      document.getElementById("result").innerHTML = "";
    }
  </script>
</body>
</html>
